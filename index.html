<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFFA 777 Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #000; font-family: Arial, Helvetica, sans-serif; }
    body { display: flex; flex-direction: column; }
    .banner {
      width: 100%;
      min-height: calc(100vh - 110px);
      background: #000 url('fundo-site.png') center top / contain no-repeat;
    }
    .faixa-preta {
      min-height: 110px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      border-top: 1px solid #2a2108;
    }
    .botao {
      display: inline-block;
      padding: 18px 48px;
      border-radius: 14px;
      border: 2px solid #f6c43c;
      background: linear-gradient(180deg, #ffd85d 0%, #d99a09 100%);
      color: #080808;
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(255, 194, 37, .35);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .botao:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(255, 194, 37, .6); }
    @media (max-width: 768px) {
      .banner { min-height: 66vw; background-size: 100% auto; }
      .faixa-preta { min-height: 100px; }
      .botao { width: min(92%, 430px); text-align: center; padding: 16px 20px; }
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="AFFA 777 Games"></main>
  <section class="faixa-preta">
    <!-- TROQUE O LINK ABAIXO PELO SITE DE DESTINO -->
    <a class="botao" href="https://www.affa777games.com" target="_blank" rel="noopener noreferrer">
      Venha se divertir
    </a>
  </section>
</body>
</html>
